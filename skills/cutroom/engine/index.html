<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>cutroom film</title>
<style>
  /* Fonts and colours: new_project.py fills in the profile's, then look.py apply sets this video's look. */
  @font-face { font-family: 'Display'; src: url(../assets/fonts/display.woff2); font-weight: 100 900; }
  @font-face { font-family: 'UI'; src: url(../assets/fonts/ui.woff2); font-weight: 100 900; }
  :root {
    --display: 'Display', 'Helvetica Neue', Arial, sans-serif;
    --ui: 'UI', 'Helvetica Neue', Arial, sans-serif;
    --mono: 'SF Mono', Menlo, Consolas, monospace;
    /* look.py apply overwrites these per video (references/look.md). accent-2/3 and field only exist for the
       'full' and 'committed'/'drenched' strategies; graphics fall back to the accent when a video has none. */
    --text: #ffffff; --ink: #0e0e0e; --muted: #9a9a9a; --accent: #FD9364; --card: #ffffff; --panel: #0e0e0e;
    --accent-2: var(--accent); --accent-3: var(--accent); --field: var(--panel); --line: #2a2a2a;
  }
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; overflow: hidden; background: #000; font-family: var(--ui); color: var(--text);
           -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  .c { position: absolute; transform-origin: 50% 50%; }
  .pill { border-radius: 999px; display: flex; align-items: center; white-space: nowrap; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="data.js"></script>
<script src="runtime.js"></script>
<script src="film.js"></script>
</body>
</html>
